[project]
name = "p2p"
version = "0.1.0"
description = "Procure-to-pay: a simulated ERP, an MCP gateway and a staged-approval invoice workflow on the agent container."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    # App 17 (the agent container) is pinned by git TAG, never a branch or a bare commit. v0.1.0 is an annotated tag
    # on 9955f1f. A slice that needs something later than this tag stops and comments on its issue.
    "agent-container",
    # Declared directly because this repo imports it (tool input models, and the pydantic output
    # schemas the AI slices add), not only through app 17. An undeclared transitive import is a
    # dependency that disappears the day the library above drops it.
    "pydantic>=2.9",
]

[project.scripts]
p2p = "p2p.cli:main"
p2p-erp = "p2p.mcp.server:main"

[tool.uv.sources]
agent-container = { git = "https://github.com/BreakthruDevelopment/17-agent-container", tag = "v0.1.0" }

[dependency-groups]
dev = [
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-timeout>=2.4.0",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["p2p"]

# `erp/` is not a Python package, so an installed wheel has no repo root to read the schema and the
# seed from. Both are force-included at `p2p/_sql/`, where `p2p.core.erp` finds them through
# `importlib.resources`; the repo copy stays the source of truth and the fallback for a source
# checkout, and a test asserts the two are byte-identical when both exist.
[tool.hatch.build.targets.wheel.force-include]
"erp/schema.sql" = "p2p/_sql/schema.sql"
"erp/seed.sql" = "p2p/_sql/seed.sql"

[tool.hatch.build.targets.sdist]
include = ["p2p", "erp", "tests", "scripts", "README.md", "pyproject.toml", "uv.lock"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "S", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
# pytest asserts are the point of a test file.
"tests/**" = ["S101"]

[tool.mypy]
strict = true
python_version = "3.12"
files = ["p2p", "tests"]
warn_unreachable = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
# A hung test fails after 60 s instead of stalling the run.
timeout = 60
