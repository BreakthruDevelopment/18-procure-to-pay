name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# GitHub's default run shell is `bash -e {0}`, which takes a pipeline's status from its LAST command. With pipefail a
# CLI that prints the expected line and then exits non-zero fails the smoke step instead of going green via `tee`.
defaults:
  run:
    shell: bash -euo pipefail {0}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    # The name is load-bearing: the branch ruleset requires exactly this string.
    name: Lint, test, build, smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # No secrets: this slice's CI needs none, and no step reads any.
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      # `--locked`, not `--frozen`: `--frozen` installs from the lock WITHOUT checking it still
      # matches pyproject.toml, so a dependency added and never relocked passes CI and is then
      # simply absent at deploy, because the Dockerfile installs the locked set. Measured:
      # adding httpx without relocking left `--frozen` at exit 0 and every step green.
      - run: uv sync --locked
      # `--frozen` on each `uv run` too: without it, `uv run` silently REWRITES uv.lock in the
      # tree and resolves the addition from PyPI, so the job both hides the error and mutates
      # the file it was meant to be validating.
      - run: uv run --frozen ruff check .
      - run: uv run --frozen ruff format --check .
      - run: uv run --frozen mypy --strict
      - run: uv run --frozen pytest
      - name: Build the package
        run: |
          uv build
          uv venv --python 3.12 /tmp/wheel-check
          # A wheel carries no [tool.uv.sources], so the pinned app 17 tag comes from the lockfile.
          uv export --quiet --frozen --no-dev --no-emit-project --no-hashes -o /tmp/runtime-reqs.txt
          uv pip install --python /tmp/wheel-check/bin/python -r /tmp/runtime-reqs.txt
          uv pip install --python /tmp/wheel-check/bin/python --no-deps dist/*.whl
          # `-P`, and run from somewhere else: without both, the repo checkout is on sys.path and
          # this "proves" the wheel by importing the source tree beside it. It would pass with the
          # ERP schema left out of the wheel entirely.
          cd /tmp
          /tmp/wheel-check/bin/python -P -c "import p2p, p2p.core, agent_container"
      - name: The installed wheel can build an ERP database
        # Not a formality: `erp/` is not a Python package, so the schema and the seed reach the
        # wheel only through the force-include in pyproject.toml. An import check cannot see that,
        # and the break would show up first at deploy.
        run: |
          cd /tmp
          /tmp/wheel-check/bin/python -P -c "
          import pathlib, tempfile
          from p2p.core.access import Principal, Role
          from p2p.core.erp import Erp
          with tempfile.TemporaryDirectory() as home:
              with Erp.open(pathlib.Path(home) / 'erp.sqlite3') as erp:
                  clerk = Principal('clerk@demo', Role.CLERK, '1000')
                  assert len(erp.list_open_invoices(clerk)) == 12
          print('the packaged schema and seed build a database')
          "
      - name: Smoke test (installed CLI)
        run: |
          /tmp/wheel-check/bin/p2p --version | tee smoke.out
          grep -q "^p2p 0.1.0$" smoke.out
          PATH="/tmp/wheel-check/bin:$PATH" scripts/smoke.sh

  image:
    name: Container image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runner
          push: false
          load: true
          tags: p2p:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Run the CLI in the image
        run: docker run --rm p2p:ci --version | grep -q "^p2p 0.1.0$"

  lambda:
    name: Lambda image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - name: Build the Lambda image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: lambda
          push: false
          load: true
          tags: p2p-lambda:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # Built for this runner's architecture on purpose: what is under test here is the image's
      # entry point, its CMD and the packaged files, none of which differ by architecture. The
      # arm64 build that Lambda actually runs is asserted in `publish.yml`, against the registry.
      - name: The image answers through the Lambda runtime, with the injected APP_VERSION
        # The AWS base image ships the runtime interface emulator, so this is the real runtime
        # resolving the real CMD. It fails if the CMD names nothing, if the wheel is missing the
        # ERP schema or the recorded health reply, or if APP_VERSION stops reaching the payload —
        # the last of which is what the live smoke compares the deployed tag against.
        run: |
          docker run -d --name p2p-lambda -p 9000:8080 -e APP_VERSION=sha-ci p2p-lambda:ci
          for _ in $(seq 1 30); do
            if curl -fsS -XPOST "http://localhost:9000/2015-03-31/functions/function/invocations" \
                 -d '{}' -o /tmp/invocation.json --max-time 20; then break; fi
            sleep 2
          done
          # Without this the next step reads a missing file and fails on a traceback instead of
          # saying that the function never answered at all.
          test -s /tmp/invocation.json || { docker logs p2p-lambda; echo "the function never answered"; exit 1; }
          echo "--- container logs ---"
          docker logs p2p-lambda
          echo "--- invocation ---"
          cat /tmp/invocation.json
          python3 - <<'PY'
          import json, pathlib, sys

          raw = pathlib.Path("/tmp/invocation.json").read_text(encoding="utf-8")
          response = json.loads(raw)
          if response.get("statusCode") != 200:
              sys.exit(f"the function did not answer 200: {raw}")
          body = json.loads(response["body"])
          for key, expected in (("status", "ok"), ("replay", "ok"), ("version", "sha-ci")):
              if body.get(key) != expected:
                  sys.exit(f"{key} was {body.get(key)!r}, expected {expected!r}: {raw}")
          print("the Lambda image answers /health: ok, replay ok, version sha-ci")
          PY
      - if: always()
        run: docker rm -f p2p-lambda
