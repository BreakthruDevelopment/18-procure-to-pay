name: Publish

# The deployed image. `30-apps-infra/apps.yaml` names an immutable `sha-<short commit>` tag, and
# `deploy/aws.sh` there copies it out of this registry with `crane copy --platform linux/arm64`
# into the AWS account's ECR. Two consequences shape this workflow:
#
#   * the manifest must carry **linux/arm64** (the stack pins `architectures = ["arm64"]`), and
#   * the package must be **anonymously pullable**: the copy authenticates to ECR, never to this
#     registry. A private package fails that copy, and because `deploy/aws.sh` runs under
#     `set -e` the failure lands before the apply, stalling every AWS app's deploy, not just
#     this one.
#
# Both are therefore asserted below, after the push, with the registry credentials removed.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

defaults:
  run:
    shell: bash -euo pipefail {0}

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  image:
    name: Publish the Lambda image
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          # `sha-<short commit>` only: the tag apps.yaml names, and never a moving one.
          tags: type=sha
          flavor: latest=false
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          target: lambda
          platforms: linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # A single plain manifest: the deploy copies one platform by digest, and an attestation
          # index would only add manifests nothing here reads.
          provenance: false
          sbom: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: The pushed tag is anonymously pullable and is linux/arm64
        # Exactly what deploy/aws.sh can do: no credentials for this registry. `docker logout`
        # drops the login above, so an unauthenticated inspect is what runs. A private package or
        # a non-arm64 manifest fails here, in this repo, instead of inside the AWS deployer where
        # only the account owner can read the error.
        run: |
          docker logout ghcr.io
          tag='${{ steps.meta.outputs.tags }}'
          echo "inspecting ${tag} anonymously"
          docker buildx imagetools inspect "$tag" | tee /tmp/manifest.txt
          grep -q 'linux/arm64' /tmp/manifest.txt
          echo "::notice::${tag} is public and linux/arm64; apps.yaml may name this tag"
